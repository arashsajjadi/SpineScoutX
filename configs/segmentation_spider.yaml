# E4 — SPIDER anatomy segmenter.
# Lightweight 2D U-Net over sagittal T1/T2 producing 4-class anatomy masks
# (background / vertebra / disc / spinal_canal). These are ANATOMY masks, not
# pathology masks.
name: e4_segmentation_spider
seed: 1337
task: segment
output_root: runs

data:
  spider_cache: data/cache/spider
  crop_size: 256          # full sagittal slice resized to 256x256
  use_25d: false
  num_workers: 8
  split_seed: 1337
  val_fraction: 0.2

model:
  kind: anatomy_segmenter
  backbone: unet          # built-in 2D U-Net; "monai_unet" if monai installed
  in_chans: 1             # single grayscale sagittal slice
  num_anatomy_classes: 4  # background + vertebra + disc + spinal_canal

train:
  epochs: 40
  batch_size: 8
  lr: 0.0005
  weight_decay: 0.00001
  amp: true
  early_stop_patience: 8
  loss: dice_ce           # Dice + CrossEntropy
  monitor: val_mean_dice
  monitor_mode: max
  device: auto

eval:
  report_per_class_dice: true
  canal_dice_separately: true
