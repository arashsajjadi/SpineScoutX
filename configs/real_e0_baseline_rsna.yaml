# E0 (REAL) — image-only baseline on real RSNA crops.
# Requires: spinescoutx prepare-rsna has produced data/cache/rsna/manifest.parquet.
name: e0_baseline_real
seed: 1337
task: classify
output_root: runs

data:
  rsna_cache: data/cache/rsna
  synthetic: false           # use the real cached RSNA crops + manifest
  crop_size: 224
  use_25d: true
  num_workers: 8
  split_seed: 1337
  val_fraction: 0.2

model:
  kind: image_classifier
  backbone: convnext_tiny     # use "small_cnn" for a fast offline sanity run
  pretrained: true
  in_chans: 3
  num_classes: 3
  use_level_embedding: true
  use_condition_embedding: true
  embed_dim: 16
  dropout: 0.2

train:
  epochs: 20
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  amp: true
  freeze_backbone_epochs: 2
  early_stop_patience: 5
  class_weighted_loss: true
  loss: weighted_ce
  monitor: val_weighted_logloss
  monitor_mode: min
  device: auto
